<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awards · {event}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  <header id="nav"></header>
  <section class="hero">
    <div id="shapes"></div>
    <div class="wrap">
      <span class="eyebrow">Awards</span>
      <h1 class="display">Earn your<br><span class="io-text">stripes.</span></h1>
      <p class="lede">Every badge has bronze, silver and gold. The best holder of each one wears its crown. They update live, so a crown can change hands at any minute.</p>
      <div class="chips" style="margin-top:24px" id="tiers"></div>
    </div>
  </section>

  <section class="section" style="padding-top:8px">
    <div class="wrap">
      <div class="section-head"><h2 class="h2" style="font-size:32px">Builder badges.</h2></div>
      <div class="grid-auto" id="personal"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section-head"><h2 class="h2" style="font-size:32px">Team badges.</h2></div>
      <div class="grid-auto" id="team"></div>
    </div>
  </section>

  <footer id="footer"></footer>
  <script src="/static/app.js"></script>
  <script src="/static/awards.js"></script>
</body>
</html>
